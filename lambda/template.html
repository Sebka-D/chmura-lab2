<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raport koszyków</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #1e3a8a; font-family: "Segoe UI", Arial, sans-serif; }
    .karta { background: #fff; border-left: 12px solid #fd7e14; border-radius: 12px; padding: 32px 48px;
             max-width: 640px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { color: #fd7e14; font-size: 2.4rem; margin-top: 0; letter-spacing: 1px; }
    .opis { font-size: 1.15rem; color: #222; }
    .stopka { font-size: .85rem; color: #777; }
  </style>
</head>
<body>
  <main class="karta">
    <h1>Raport dla {{IMIE}}</h1>
    <p class="opis">Zestawienie porzuconych i opłaconych koszyków w sklepie internetowym.</p>
    <p class="nowe"><b>NOWE ZDANIE: szablon podmieniony w S3 bez ponownego wdrażania funkcji.</b></p>
    <p class="stopka">Wersja dynamiczna – HTML składany przez funkcję Lambda z szablonu w S3.</p>
  </main>
</body>
</html>
